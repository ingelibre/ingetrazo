# IngeTrazo's Flatpak, for self-distribution (bundle on each GitHub
# release), NOT Flathub — Flathub forbids network during build, and the app
# module below lets pip download wheels. The shape follows IngeCAD's proven
# manifest (packaging/flatpak/ in that repo), krb5 lesson included.
app-id: com.ingetrazo.IngeTrazo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# The Rust engine (rust/ingetrazo_core, #767) is compiled at build time;
# only the SDK carries cargo, the finished module needs nothing at run time.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ingetrazo

finish-args:
  # GUI — native Wayland when present, X11 when it is not... and X11 also
  # when Wayland IS present, which is why this is --socket=x11 and not
  # --socket=fallback-x11: "fallback" hands over nothing while a Wayland
  # socket exists, and then core.gl_fallback has no X11 to escape to on a
  # driver whose EGL cannot give us a desktop-GL context (the NVIDIA
  # report of 2026-09-09). Costs the usual X11 sandbox hole; buys an app
  # that opens on those machines instead of showing nothing.
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri                 # the OpenGL viewport IS the application
  # The user's models live anywhere (~/Descargas, pCloud mounts, USB).
  - --filesystem=home
  # Unlike IngeCAD, IngeTrazo DOES use the network: base-map tiles, the
  # AWS terrarium DEM for 3D terrain, and location geocoding (Track G).
  - --share=network
  # The 3D mouse (issue #108): spacenavd serves it on this socket; without
  # the hole the sandbox never sees the device. Read-only, like Blender's.
  - --filesystem=/run/spnav.sock:ro

modules:
  # PySide6's Qt links QtNetwork against GSSAPI; the Freedesktop runtime
  # carries no libgssapi_krb5.so.2. Without this, importing QtNetwork (the
  # tile fetcher) dies at load time. Verbatim from the IngeCAD manifest,
  # C23 workaround included.
  - name: krb5
    subdir: src
    build-options:
      cflags: -std=gnu17 -Wno-implicit-function-declaration -Wno-implicit-int -Wno-int-conversion -Wno-incompatible-pointer-types
    config-opts:
      - --disable-static
      - --without-ldap
      - --without-tcl
      - --without-libedit
      - --without-readline
      - --disable-rpath
    cleanup:
      - /bin
      - /sbin
      - /share
      - /include
      - /etc
      - '*.la'
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.21/krb5-1.21.3.tar.gz
        sha256: b7a4cd5ead67fb08b980b21abd150ff7217e85ea320c9ed0c6dadd304840ad35
        mirror-urls:
          - https://web.mit.edu/kerberos/dist/krb5/1.21/krb5-1.21.3.tar.gz

  - name: ingetrazo
    buildsystem: simple
    build-options:
      build-args:
        - --share=network        # pip downloads the wheels (self-dist only)
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/ingetrazo/cargo
    build-commands:
      # 1. Python dependencies into /app's prefix. pytest is a test tool.
      - grep -vE '^\s*pytest\b' requirements.txt > reqs.txt
      - pip3 install --prefix=${FLATPAK_DEST} --no-warn-script-location -r reqs.txt
      # 1b. The Rust engine, the same wheel the other builds make (cargo
      #     fetches the crates: network, as for pip). maturin is a build
      #     tool and stays out of /app.
      - pip3 install --prefix=/run/build/ingetrazo/tools --no-warn-script-location maturin
      - PYTHONPATH=$(echo /run/build/ingetrazo/tools/lib/python3*/site-packages) /run/build/ingetrazo/tools/bin/maturin build --release -m rust/ingetrazo_core/Cargo.toml -o wheels
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-warn-script-location wheels/ingetrazo_core-*.whl
      - python3 -c "import sys; sys.path.insert(0, [p for p in __import__('glob').glob('${FLATPAK_DEST}/lib/python3*/site-packages')][0]); import ingetrazo_core"
      # openskp's blank writer template is not distributed (no .skp export).
      - rm -rf ${FLATPAK_DEST}/lib/python3*/site-packages/openskp/_scaffold
      # 2. The application, as source — GPL code hides from nobody.
      #    materials/ and styles/ are importable packages; plugins/ carries
      #    the bundled reference extensions (core/extensions.py discovers
      #    them under app_root(), which resolves to /app/ingetrazo here).
      - mkdir -p ${FLATPAK_DEST}/ingetrazo
      - cp -a main.py core views tools formats georef materials styles plugins resources i18n scripts LICENSE ${FLATPAK_DEST}/ingetrazo/
      # The example extensions (Extensions ▸ Example extensions installs one
      # into the user's plugins folder): shipped, never loaded by default.
      # DWG import (#101): LibreDWG's dwg2dxf, the same binary the AppImage
      # carries (libc/libm only; runs on the 25.08 runtime). formats.dwg_bridge
      # finds it under app_root()/vendor/libredwg/bin; SOURCES.md says where
      # its source is, as the GPL asks.
      - install -Dm755 vendor/libredwg/bin/dwg2dxf ${FLATPAK_DEST}/ingetrazo/vendor/libredwg/bin/dwg2dxf
      - install -Dm644 vendor/libredwg/SOURCES.md ${FLATPAK_DEST}/ingetrazo/vendor/libredwg/SOURCES.md
      - mkdir -p ${FLATPAK_DEST}/ingetrazo/examples
      - cp -a examples/extensions ${FLATPAK_DEST}/ingetrazo/examples/
      - find ${FLATPAK_DEST}/ingetrazo -name '__pycache__' -type d -exec rm -rf {} +
      # Bytecode, compiled once here (#440, @cdblue999): /app is read-only,
      # so without it Python recompiled the whole tree on every launch
      # (import 1.2 → 0.26 s on his laptop). «unchecked-hash» because ostree
      # sets every file's mtime to 0, which makes timestamp-checked .pyc
      # files stale — these are trusted as built. site-packages too, for the
      # same mtime reason (pip wrote timestamp .pyc there). PySide6's
      # deploy templates (*.tmpl.py, Jinja, not Python) are skipped: they
      # failed the v0.5.8 tag build.
      - python3 -m compileall -q -j0 --invalidation-mode unchecked-hash -x '\.tmpl\.py$' ${FLATPAK_DEST}/ingetrazo ${FLATPAK_DEST}/lib
      # 3. Launcher + desktop integration (exports must carry the app id).
      - install -Dm755 packaging/flatpak/flatpak-launcher.sh ${FLATPAK_DEST}/bin/ingetrazo
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 resources/icons/ingetrazo_256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      # 4. MIME types (.igz / .skp / .dae) so double-click opens IngeTrazo —
      #    with the branded document icons. Flatpak only exports icons whose
      #    file name starts with the app id, so a plain
      #    "application-x-ingetrazo" never left the sandbox and the file
      #    manager painted the generic white sheet on every .igz/.skp. The
      #    icons go in under the id prefix and the XML points at those names.
      - |
        mkdir -p "${FLATPAK_DEST}/share/mime/packages"
        sed -e 's|<icon name="\([^"]*\)"/>|<icon name="'"${FLATPAK_ID}"'.\1"/>|' \
          resources/mime/ingetrazo.xml > "${FLATPAK_DEST}/share/mime/packages/${FLATPAK_ID}.xml"
        grep -q "${FLATPAK_ID}.application-x-ingetrazo" "${FLATPAK_DEST}/share/mime/packages/${FLATPAK_ID}.xml"
        for d in resources/icons/hicolor/*/mimetypes; do
          size=$(basename "$(dirname "$d")")
          for f in "$d"/*.png; do
            install -Dm644 "$f" "${FLATPAK_DEST}/share/icons/hicolor/${size}/mimetypes/${FLATPAK_ID}.$(basename "$f")"
          done
        done
      # 5. Trim PySide6 to the Qt modules IngeTrazo imports (QtCore, QtGui,
      #    QtWidgets, QtOpenGL(+Widgets), QtNetwork — tiles/DEM). The full
      #    wheel installs 771 MB, 195 of them a WebEngine no line of this
      #    program touches. Blocklist, not allowlist: an unknown library
      #    stays, so a Qt upgrade can add deps without blanking the app.
      #
      #    ⚠️ QtPrintSupport is NOT on the list, and must not go back on it:
      #    the sheet composer's «Print preview» imports it, and with the
      #    module gone the import failed inside the slot, silently — the
      #    button simply did nothing, which is exactly what Rafael reported
      #    on 2026-09-16 (30:20) while PDF export, which goes through
      #    QPdfWriter in QtGui, worked perfectly for him. QtPdf IS still
      #    trimmed: that is the PDF *viewer*, which we do not use.
      - |
        set -e
        PYVER=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
        PS=${FLATPAK_DEST}/lib/python${PYVER}/site-packages/PySide6
        cd "$PS"
        rm -rf Qt/qml Qt/resources Qt/libexec Qt/metatypes examples typesystems glue include
        rm -f  assistant designer linguist lupdate lrelease qmlformat qmllint qmlls qsb balsam* svgtoqml
        for stem in WebEngine Pdf Quick Qml 3D Quick3D Multimedia SpatialAudio                     Location Positioning Sensors SerialPort SerialBus Bluetooth                     Nfc WebSockets WebChannel WebView RemoteObjects Scxml                     TextToSpeech Charts DataVisualization Graphs Sql Help                     UiTools Designer NetworkAuth HttpServer VirtualKeyboard                     LabsAnimation LabsFolderListModel LabsPlatform LabsQmlModels                     LabsSettings LabsSharedImage LabsWavefrontMesh Test; do
          rm -f  Qt${stem}*.abi3.so Qt${stem}*.pyi
          rm -f  Qt/lib/libQt6${stem}*.so*
        done
        # Quick/Qml family again by lib name (Quick3D matches Quick prefix)
        rm -f Qt/lib/libQt6Quick*.so* Qt/lib/libQt6Qml*.so*
        # ffmpeg came along for Multimedia
        rm -f Qt/lib/libav*.so* Qt/lib/libsw*.so*
        rm -rf Qt/plugins/multimedia Qt/plugins/webview Qt/plugins/qmltooling                Qt/plugins/scenegraph Qt/plugins/designer Qt/plugins/assetimporters                Qt/plugins/sceneparsers Qt/plugins/renderers Qt/plugins/geometryloaders                Qt/plugins/sqldrivers Qt/plugins/position Qt/plugins/sensors                Qt/plugins/canbus Qt/plugins/virtualkeyboard Qt/plugins/texttospeech
        du -sh "$PS"
    sources:
      - type: dir
        path: ../../
        skip:
          - venv
          - build
          - dist
          - .git
          - capturas
          - analysis
          - tests
          - rust/ingetrazo_core/target
          - packaging/flatpak/.staging
          - packaging/flatpak/.flatpak-builder
