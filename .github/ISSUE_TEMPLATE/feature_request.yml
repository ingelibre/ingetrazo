name: Feature request
description: Propose a new feature or an improvement to an existing one.
labels:
  - enhancement
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem before the
        solution — it's easier for a Reviewer/Lead to evaluate alternatives
        that way.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate check
      description: >-
        Please [search existing issues](https://github.com/ingelibre/ingetrazo/issues?q=is%3Aissue)
        (open and closed) before filing a new one.
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem being solved
      description: What are you trying to do that IngeTrazo doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Other approaches, workarounds, or tools (including other 3D apps)
        that solve this today, and why they fall short.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Mockups, references, related issues, anything else useful.
    validations:
      required: false
