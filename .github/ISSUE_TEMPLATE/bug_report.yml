name: Bug report
description: Report something that isn't working as expected.
labels:
  - bug
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much
        detail as you can — it helps a Reviewer triage this faster.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate check
      description: >-
        Please [search existing issues](https://github.com/ingelibre/ingetrazo/issues?q=is%3Aissue)
        (open and closed) before filing a new one.
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true

  - type: input
    id: version
    attributes:
      label: Version / build
      description: >-
        The IngeTrazo version or build you're using (Help → About, or the
        filename of the installer/AppImage you downloaded).
      placeholder: e.g. 0.4.2, or installer build from 2025-10-01
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other (specify in description below)
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so a maintainer can reproduce it locally.
      placeholder: |
        1. Open ...
        2. Click on ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages if any.
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots / attachments (optional)
      description: >-
        Drag and drop screenshots, screen recordings, or a sample
        `.igz`/model file that reproduces the issue.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Anything else that might be relevant (GPU, logs, recent changes, ...).
    validations:
      required: false
