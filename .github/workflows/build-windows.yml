name: Build Windows

# Cuándo corre:
#   - Push de un tag vX.Y.Z  → build + adjunta los binarios al Release
#   - Manual desde la pestaña Actions (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publicar:
        description: >-
          Archivos para publicar (reemplazar en una release): nunca con la
          firma de prueba, que Windows no reconoce y que Smart App Control
          puede bloquear (#566)
        type: boolean
        default: false

# El GITHUB_TOKEN necesita esto para adjuntar archivos al release.
permissions:
  contents: write

# The bundle's --check fails if the Rust engine is missing (core._native).
env:
  INGETRAZO_REQUIRE_RUST: "1"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 3.12: la versión de referencia para wheels en CI (misma que
      # IngePresupuestos). El código corre igual en 3.10+.
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.2 numpy "ezdxf>=1.4.4" "manifold3d>=3.5.3" "truststore>=0.10.5"
          # PyInstaller con el bootloader COMPILADO AQUÍ (MSVC del runner),
          # no el precompilado del wheel: ese binario lo comparten miles de
          # programas (y malware), y los antivirus lo tienen fichado — la
          # causa habitual de falsos positivos como el de la #162. No lo
          # garantiza (Wacatac.B!ml es heurístico), pero lo reduce.
          # OJO: `pip install --no-binary` NO basta — el sdist también trae
          # los bootloaders precompilados y los instala tal cual (medido en
          # el run 36505183570: «wheel» en 0,06 s). Hay que compilarlo con
          # waf dentro del sdist y luego instalar ESE árbol.
          pip download --no-binary pyinstaller --no-deps pyinstaller -d "$RUNNER_TEMP/pyi"
          # tar de Git Bash toma «D:\...» por un host remoto: extraer con Python.
          PYI_SRC="$(python -c "import glob, os, sys, tarfile; d = os.path.join(os.environ['RUNNER_TEMP'], 'pyi'); t = tarfile.open(glob.glob(os.path.join(d, 'pyinstaller-*.tar.gz'))[0]); t.extractall(d, filter='data'); print(os.path.join(d, t.getnames()[0].split('/')[0]))")"
          PYI_SRC="$(cygpath -u "$PYI_SRC")"
          rm -f "$PYI_SRC"/PyInstaller/bootloader/Windows-64bit-intel/*.exe
          (cd "$PYI_SRC/bootloader" && python ./waf all --target-arch=64bit)
          # Sin los .exe recién compilados, fallar: nunca publicar con el viejo.
          test -f "$PYI_SRC/PyInstaller/bootloader/Windows-64bit-intel/run.exe"
          test -f "$PYI_SRC/PyInstaller/bootloader/Windows-64bit-intel/runw.exe"
          sha256sum "$PYI_SRC"/PyInstaller/bootloader/Windows-64bit-intel/*.exe
          pip install "$PYI_SRC"
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"
          # openskp NATIVO: UPSTREAM main — todos nuestros parches están
          # mergeados allá (corpus legacy 186/186 PRs #194/#199, cotas y
          # textos guía PR #203). Pineado por SHA para builds
          # reproducibles; avanzar el SHA cuando upstream traiga algo
          # que necesitemos.
          pip install "openskp @ git+https://github.com/iamahsanmehmood/openskp@291700bc213655a00461838de71e5f206311e619#subdirectory=packages/python"
          python -c "import openskp, openskp.legacy; print('openskp OK:', openskp.__name__)" 

      # El motor Rust (rust/ingetrazo_core, Preferencias ▸
      # General; encendido por defecto desde la 0.5.10). Si no compila, falla aquí: nunca
      # publicar un instalador que lo promete y no lo trae.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Motor Rust
        shell: bash
        run: |
          pip install maturin
          maturin build --release -m rust/ingetrazo_core/Cargo.toml -o "$RUNNER_TEMP/wheels"
          pip install "$RUNNER_TEMP"/wheels/ingetrazo_core-*.whl
          INGETRAZO_RUST=1 python -c "import core._native as n; assert n.native is not None; print('motor:', n.engine())"

      # DWG en Windows (#101): el dwg2dxf.exe OFICIAL de LibreDWG (su
      # release win64, mingw), con las dos DLL que carga — nada más del zip.
      # Hash medido el 2026-09-28 (su dist.sha256 no lista los zips): si
      # cambia, falla aquí en vez de empaquetar otra cosa. Mismo resultado
      # que el binario de Linux sobre un DWG real (10 084 entidades, 65 capas).
      - name: Conversor DWG (LibreDWG win64)
        shell: bash
        run: |
          set -e
          V=0.14.8597
          SHA=7fee5c67c4f451f0542c0d6a3b12e91e99b15faf363fbf8b98ad84bac17ddfa2
          curl -fsSL -o "$RUNNER_TEMP/ldwg.zip" \
            "https://github.com/LibreDWG/libredwg/releases/download/$V/libredwg-$V-win64.zip"
          echo "$SHA  $RUNNER_TEMP/ldwg.zip" | sha256sum -c -
          mkdir -p vendor/libredwg/bin
          unzip -j -o "$RUNNER_TEMP/ldwg.zip" dwg2dxf.exe libredwg-0.dll libiconv-2.dll \
            -d vendor/libredwg/bin
          ls -la vendor/libredwg/bin

      - name: Compilar con PyInstaller
        shell: bash
        run: |
          pyinstaller ingetrazo.spec --noconfirm
          ls -la dist/
          du -sh dist/ingetrazo/

      - name: Humo mínimo del bundle
        shell: bash
        run: |
          # El exe existe y los recursos críticos quedaron dentro.
          test -f dist/ingetrazo/ingetrazo.exe
          test -f dist/ingetrazo/_internal/resources/shaders/basic.vert
          test -f dist/ingetrazo/_internal/i18n/es.json
          test -f dist/ingetrazo/_internal/resources/components/components.json
          # La plantilla .skp en blanco de openskp la generó una herramienta
          # propietaria: desde el 2026-09-28 NO se distribuye (ingetrazo.spec
          # la excluye y no hay exportación a .skp). Si
          # un paquete la trae otra vez, falla aquí — y también --check.
          test ! -e dist/ingetrazo/_internal/openskp/_scaffold
          # El conversor DWG y sus DLL (#101).
          for f in dwg2dxf.exe libredwg-0.dll libiconv-2.dll; do
            test -f "dist/ingetrazo/_internal/vendor/libredwg/bin/$f"
          done
          # …y sin la segunda copia de las DLL en la raíz (31 MB de sobra).
          test ! -e dist/ingetrazo/_internal/libredwg-0.dll
          # Qt va por schannel: sin su backend OpenSSL ni las DLL -x64, una
          # libssl ajena en System32 ya no rompe el gestor (#564). La
          # OpenSSL de Python (libssl-3.dll, sin -x64) sí se queda.
          test ! -e dist/ingetrazo/_internal/PySide6/plugins/tls/qopensslbackend.dll
          test -f dist/ingetrazo/_internal/PySide6/plugins/tls/qschannelbackend.dll
          test ! -e dist/ingetrazo/_internal/libssl-3-x64.dll
          test ! -e dist/ingetrazo/_internal/libcrypto-3-x64.dll
          test -f dist/ingetrazo/_internal/libssl-3.dll
          # Y el mismo --check que ya corren el tar, el AppImage y el snap
          # (release.yml), que Windows no tenía: cubre estos archivos y los
          # que se añadan después, sin que haya que acordarse de listarlos
          # aquí. Va antes que Qt, así que no abre ventana; devuelve 1 si
          # falta algo.
          ./dist/ingetrazo/ingetrazo.exe --check
          echo "bundle OK"

      # ── Firma (SignPath Foundation, org «IngeTrazo [OSS]») ─────────────
      # Cada firma espera a que Marco la apruebe en app.signpath.io. Sin el
      # secret (forks) se salta y sale sin firmar, como antes. El secret
      # solo lo ve este paso y el de SignPath, no pip ni PyInstaller.
      # La política va en la variable SIGNPATH_POLICY del repo:
      # test-signing hasta que llegue el certificado de release (08-10 en
      # «CSR pending»), luego release-signing.
      - name: ¿Hay firma?
        id: firma
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          POLICY: ${{ vars.SIGNPATH_POLICY }}
          PUBLICAR: ${{ inputs.publicar }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Sin SIGNPATH_API_TOKEN: sale sin firmar"
          elif [[ ( "$GITHUB_REF" == refs/tags/* || "$PUBLICAR" == true ) && "$POLICY" != release-signing ]]; then
            # (Lanzado a mano con «publicar»: igual que un tag. Los archivos
            # de la 0.5.8 se reemplazaron con builds a mano y salieron con
            # el certificado de prueba, #566.)
            # Una release con el certificado de prueba no sirve: Windows no
            # confía en él. Mejor sin firmar, como antes.
            echo "::warning::Release sin SIGNPATH_POLICY=release-signing: sale sin firmar"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir los .exe para firmar
        id: exe-sin-firmar
        if: steps.firma.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: exe-sin-firmar
          path: |
            dist/ingetrazo/ingetrazo.exe
            dist/ingetrazo/ingetrazo-mcp.exe
          if-no-files-found: error
          retention-days: 1

      # Configuración «programa» en SignPath: los dos .exe en la raíz del zip.
      # Los firmados reemplazan a los de dist/ingetrazo/ antes del ZIP y de
      # Inno Setup, así ambos llevan los .exe firmados.
      - name: Firmar los .exe (SignPath)
        if: steps.firma.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 45ff474d-922e-4e28-bc0a-837061f69143
          project-slug: ingetrazo
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY || 'test-signing' }}
          artifact-configuration-slug: programa
          github-artifact-id: ${{ steps.exe-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/ingetrazo

      - name: Incluir LEEME en el bundle
        shell: bash
        run: |
          cat > dist/ingetrazo/LEEME.txt <<'EOF'
          IngeTrazo para Windows

          Recomendado: usar el INSTALADOR (ingetrazo-setup-vX.Y.Z.exe).
          Este .zip es la version portable para usuarios tecnicos.

          === Modo portable (este .zip) ===

          1. Descomprimi esta carpeta donde quieras (ej. C:\IngeTrazo\)
          2. Doble clic en ingetrazo.exe
          3. Si Windows muestra "Windows protegio tu PC" → "Mas informacion"
             → "Ejecutar de todas formas" (falta firma digital; se agrega
             mas adelante).

          Las preferencias se guardan en el registro de Windows y el cache
          de teselas en %LOCALAPPDATA%\IngeTrazo\.

          Si al abrir falla con "Failed to load python312.dll", instala:
            https://aka.ms/vs/17/release/vc_redist.x64.exe
            (Visual C++ Redistributable, oficial de Microsoft).

          IngeTrazo es software libre (GPL-3.0).
          Codigo y soporte: https://github.com/tuxiasumari/ingetrazo
          EOF

      - name: Crear ZIP portable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ingetrazo -DestinationPath dist/ingetrazo-windows.zip

      - name: Extraer versión (del tag o de core/version.py)
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^__version__' core/version.py | cut -d'"' -f2)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Compilar instalador con Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-Not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-Not (Test-Path $iscc)) {
            Write-Error "Inno Setup no encontrado"
            exit 1
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\ingetrazo.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir el instalador para firmar
        id: setup-sin-firmar
        if: steps.firma.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: setup-sin-firmar
          path: dist/ingetrazo-setup-v*.exe
          if-no-files-found: error
          retention-days: 1

      # Configuración «instalador» en SignPath.
      - name: Firmar el instalador (SignPath)
        if: steps.firma.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 45ff474d-922e-4e28-bc0a-837061f69143
          project-slug: ingetrazo
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY || 'test-signing' }}
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.setup-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      # Con test-signing la firma existe pero Windows no confía en ella
      # (Status ≠ Valid): aquí solo se mira que el .exe lleve firma.
      - name: Comprobar las firmas
        if: steps.firma.outputs.on == 'true'
        shell: pwsh
        run: |
          $files = @("dist/ingetrazo/ingetrazo.exe", "dist/ingetrazo/ingetrazo-mcp.exe") + (Get-ChildItem dist/ingetrazo-setup-v*.exe).FullName
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1} — {2}" -f (Split-Path $f -Leaf), $sig.Status, $sig.SignerCertificate.Subject
            if (-not $sig.SignerCertificate) { Write-Error "$f sin firma"; exit 1 }
          }

      - name: Listar archivos generados
        shell: bash
        run: ls -lh dist/

      - name: Subir artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ingetrazo-windows
          path: |
            dist/ingetrazo-windows.zip
            dist/ingetrazo-setup-v*.exe
          retention-days: 7

      # En push de tag: adjunta los binarios al Release de esa versión.
      - name: Publicar en el Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ingetrazo-windows.zip
            dist/ingetrazo-setup-v*.exe
