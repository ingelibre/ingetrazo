# SPDX-License-Identifier: GPL-3.0-or-later
# Build the Flatpak bundle on a tag and attach it to the release.
# (The AppImage + tarball are release.yml; the Windows installer is
# build-windows.yml. All three fire on the same tag.)
#
# The bundle used to be built by hand on the maintainer's machine, so it rode
# whichever release he remembered — v0.3.5 had one, v0.3.6.2 did not. This is
# the same `packaging/flatpak/build-flatpak.sh --bundle` the manifest was
# written for, run by the pipeline instead.
name: release-flatpak

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # so the pipeline can be exercised without a tag
    inputs:
      tag:
        description: >-
          Publicar el repo Flatpak con el bundle de esta release YA existente
          (p. ej. v0.3.9): no compila nada ni crea releases. Vacío = solo
          compila el bundle de prueba, sin publicar.
        required: false
        default: ""
        type: string

permissions:
  contents: write           # to upload the asset to the release

jobs:
  bundle:
    name: Flatpak bundle (x86_64)
    # A manual run that names an existing tag only publishes: no rebuild.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and the builder
        run: |
          sudo apt-get update -qq
          # elfutils: flatpak-builder strips debuginfo out of every module
          # with eu-strip, and the runner does not ship it — the krb5 module
          # got as far as installing and then died on "Failed to execute
          # child process eu-strip" (first tag run, v0.3.6.3).
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils
          # The manifest's runtime, from Flathub. --user keeps everything in
          # the runner's home, so no root is needed past the apt step.
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install the runtime and SDK the manifest asks for
        run: |
          # Read them from the manifest instead of hard-coding: the version
          # moves, and a workflow that pins its own would build against the
          # wrong one without saying so.
          RUNTIME=$(grep -m1 '^runtime:' packaging/flatpak/com.ingetrazo.IngeTrazo.yml | awk '{print $2}')
          SDK=$(grep -m1 '^sdk:' packaging/flatpak/com.ingetrazo.IngeTrazo.yml | awk '{print $2}')
          VER=$(grep -m1 '^runtime-version:' packaging/flatpak/com.ingetrazo.IngeTrazo.yml | tr -d "'\"" | awk '{print $2}')
          echo "runtime=$RUNTIME//$VER  sdk=$SDK//$VER"
          flatpak install --user --noninteractive flathub "$RUNTIME//$VER" "$SDK//$VER"

      - name: The metainfo must name the version being shipped
        run: |
          # `flatpak list` and every software centre read the version from
          # the newest <release> in the metainfo, not from the code. It was
          # hand-maintained and drifted: v0.3.7 installed and still reported
          # itself as 0.3.4. A missing entry is injected rather than failing
          # the release — but write one by hand with a real description.
          python3 - <<'PY'
          import datetime, pathlib, re
          ver = re.search(r"__version__\s*=\s*.([^'\"]+)",
                          pathlib.Path("core/version.py").read_text()).group(1)
          f = pathlib.Path(
              "packaging/flatpak/com.ingetrazo.IngeTrazo.metainfo.xml")
          xml = f.read_text(encoding="utf-8")
          if 'version="%s"' % ver in xml:
              print("metainfo already names %s" % ver)
          else:
              today = datetime.date.today().isoformat()
              xml = xml.replace(
                  "  <releases>\n",
                  '  <releases>\n    <release version="%s" date="%s"/>\n'
                  % (ver, today), 1)
              f.write_text(xml, encoding="utf-8")
              print("::warning::metainfo had no entry for %s — a bare one "
                    "was injected; add a description in the repo" % ver)
          PY

      - name: Build the bundle
        run: packaging/flatpak/build-flatpak.sh --bundle

      - name: Name it after the version
        id: name
        run: |
          # Anchor on the assignment: a bare quoted-string search picks up
          # the module docstring instead.
          VERSION=$(python3 -c "import re,pathlib; \
            print(re.search(r'__version__\s*=\s*.([^\x27\"]+)', \
            pathlib.Path('core/version.py').read_text()).group(1))")
          mkdir -p dist
          cp packaging/flatpak/.staging/IngeTrazo.flatpak \
             "dist/IngeTrazo-${VERSION}-x86_64.flatpak"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: IngeTrazo-flatpak-x86_64
          path: dist/IngeTrazo-*.flatpak
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release usually exists already (created by hand with notes, or
          # by one of the sibling workflows); create a bare one only if we got
          # here first.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "IngeTrazo ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/IngeTrazo-*.flatpak --clobber

  # El paso que siempre fue manual y por el que tres releases seguidas no
  # llegaron a los usuarios: el bundle publicado NO actualiza el repo de
  # ingetrazo.com — hay que importarlo al repo ostree y redesplegar el
  # sitio. Este job lo hace solo: espeja el repo VIVO por HTTP (archive-z2
  # se puede espejar), importa el bundle recién subido al release, regenera
  # el índice y despliega ingetrazo-web (repo público) con wrangler.
  # Necesita el secret CLOUDFLARE_API_TOKEN (plantilla "Edit Cloudflare
  # Workers" en dash.cloudflare.com); sin él, avisa y no rompe el release.
  publish-repo:
    name: Publish the Flatpak repo (ingetrazo.com)
    needs: bundle
    # On a tag, after the bundle is on the release; by hand, for the tag
    # given (the bundle job is skipped then — hence the result check).
    if: >-
      ${{ !cancelled()
          && (needs.bundle.result == 'success' || needs.bundle.result == 'skipped')
          && (startsWith(github.ref, 'refs/tags/v')
              || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install flatpak and ostree
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - name: Check out the website (public repo)
        run: git clone --depth 1 https://github.com/ingelibre/ingetrazo-web.git web

      - name: Mirror the LIVE repo, import the new bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd web
          mkdir -p flatpak/repo
          ostree init --mode=archive-z2 --repo=flatpak/repo
          ostree remote add --repo=flatpak/repo --no-gpg-verify \
            live https://ingetrazo.com/flatpak/repo
          # Mirror = the existing history, bit for bit — every ref the live
          # summary advertises; a brand-new/empty live repo just pulls
          # nothing and the bundle import starts the history.
          ostree pull --repo=flatpak/repo --mirror live \
            || echo "::warning::mirror parcial o repo vivo vacío — se continúa con el bundle"
          gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null \
            || { echo "::error::No existe la release $TAG"; exit 1; }
          gh release download "$TAG" -R "${GITHUB_REPOSITORY}" \
            -p "IngeTrazo-*-x86_64.flatpak" --dir /tmp/bundle
          flatpak build-import-bundle flatpak/repo /tmp/bundle/IngeTrazo-*-x86_64.flatpak
          flatpak build-update-repo flatpak/repo

      - name: Deploy ingetrazo.com (if credentials exist)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # A token pasted into the secret with a trailing newline or a
          # space reaches wrangler as an invalid HTTP header value and the
          # deploy dies ("Headers.set: ... is an invalid header value" —
          # the v0.3.9 first flight). Trim it, and say so without echoing it.
          RAW_LEN=${#CLOUDFLARE_API_TOKEN}
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" \
            | sed -E 's/^[[:space:]"'"'"']+//; s/[[:space:]"'"'"']+$//; s/^[Bb]earer[[:space:]]+//' \
            | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          if [ "$RAW_LEN" != "${#CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN traía espacios, comillas o 'Bearer' (recortados); recrear el secret limpio."
          fi
          # A Cloudflare API TOKEN is 40 chars of [A-Za-z0-9_-]. Anything else
          # (the 37-hex Global API Key, an OAuth token, a pasted URL) is
          # refused by the API as "Invalid format for Authorization header".
          if [ -n "$CLOUDFLARE_API_TOKEN" ] \
             && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -Eq '^[A-Za-z0-9_-]{40}$'; then
            echo "::warning::CLOUDFLARE_API_TOKEN no tiene forma de API Token (40 caracteres, letras/números/_/-): largo ${#CLOUDFLARE_API_TOKEN}. Crear uno en Cloudflare ▸ My Profile ▸ API Tokens ▸ plantilla 'Edit Cloudflare Workers' y pegarlo tal cual."
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Sin CLOUDFLARE_API_TOKEN — el repo Flatpak NO se publicó; correr el manual o crear el secret."
            exit 0
          fi
          cd web
          npx --yes wrangler deploy

      - name: Verify the live repo serves the new summary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" \
            | sed -E 's/^[[:space:]"'"'"']+//; s/[[:space:]"'"'"']+$//; s/^[Bb]earer[[:space:]]+//' \
            | tr -d '[:space:]')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          sleep 10
          curl -fsS https://ingetrazo.com/flatpak/repo/summary -o /tmp/remote.summary
          cmp /tmp/remote.summary web/flatpak/repo/summary
          echo "repo vivo == repo recién construido, bit a bit"
