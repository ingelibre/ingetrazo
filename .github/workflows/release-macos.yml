# SPDX-License-Identifier: GPL-3.0-or-later
# Build the macOS .dmg on a tag and attach it to the release (PR #64,
# @felixriestra: packaging/build-macos-app.sh wraps the onedir as
# IngeTrazo.app and the .app in a drag-to-Applications .dmg).
#
# Its own workflow so a Mac-side failure never holds up the Linux and
# Windows assets. Apple Silicon (arm64) and Intel (x86_64): a class of 60
# students had 8 Intel Macs among 12 (José Castro, UDELAR, 2026-10-05).
# Unsigned — the first launch is right-click ▸ Open, as the README says.
name: release-macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # exercise the build without a tag (artifact only)

permissions:
  contents: write           # to upload the .dmg to the release

# The bundle's --check fails if the Rust engine is missing (core._native).
env:
  INGETRAZO_REQUIRE_RUST: "1"

jobs:
  dmg:
    name: .app + .dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false            # one Mac failing never holds the other
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel; the .dmg is named by uname -m
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          grep -vE '^\s*pytest\b' requirements.txt > reqs.txt
          python -m pip install -r reqs.txt pyinstaller

      # The Rust engine (rust/ingetrazo_core, Preferences ▸
      # General; on by default since 0.5.10), built for this runner's architecture.
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust engine
        run: |
          python -m pip install maturin
          maturin build --release -m rust/ingetrazo_core/Cargo.toml -o "$RUNNER_TEMP/wheels"
          python -m pip install "$RUNNER_TEMP"/wheels/ingetrazo_core-*.whl
          INGETRAZO_RUST=1 python -c "import core._native as n; assert n.native is not None; print('engine:', n.engine())"

      # DWG on macOS (#101): LibreDWG publishes no Mac binaries, so build
      # dwg2dxf from the release tarball (hash from its dist.sha256, the
      # same release the Windows build takes). Static libredwg; only the
      # system's libiconv and libSystem at run time.
      - name: DWG converter (LibreDWG, from source)
        run: |
          set -e
          V=0.14.8597
          SHA=af2646681858a78d756cfb9e0eeb6901f61be3d09ae8f56a98e94b1490dec4ed
          cd "$RUNNER_TEMP"
          curl -fsSL -O "https://github.com/LibreDWG/libredwg/releases/download/$V/libredwg-$V.tar.xz"
          echo "$SHA  libredwg-$V.tar.xz" | shasum -a 256 -c -
          tar xf "libredwg-$V.tar.xz"
          cd "libredwg-$V"
          ./configure --disable-shared --disable-bindings --disable-python >/dev/null
          make -j"$(sysctl -n hw.ncpu)" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/vendor/libredwg/bin"
          install -m 0755 programs/dwg2dxf "$GITHUB_WORKSPACE/vendor/libredwg/bin/dwg2dxf"
          otool -L "$GITHUB_WORKSPACE/vendor/libredwg/bin/dwg2dxf"
          "$GITHUB_WORKSPACE/vendor/libredwg/bin/dwg2dxf" --version || true

      - name: Build IngeTrazo.app and the .dmg
        env:
          PYTHON: python
        run: packaging/build-macos-app.sh dist

      - name: The bundle finds everything it needs
        run: dist/IngeTrazo.app/Contents/MacOS/ingetrazo --check

      - uses: actions/upload-artifact@v4
        with:
          name: ingetrazo-macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "IngeTrazo ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber
