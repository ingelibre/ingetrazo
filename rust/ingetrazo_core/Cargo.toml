[package]
name = "ingetrazo_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native kernels for IngeTrazo's heavy computations (optional: Python falls back)"
publish = false

[lib]
name = "ingetrazo_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
